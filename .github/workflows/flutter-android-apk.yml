name: Build Khazain Al-Huda Android APK

on:
  push:
    branches: ["main", "redesign/ali-sharha-lara-v2"]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation/build for each branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package tracked source files
        run: git archive --format=zip --output="$GITHUB_WORKSPACE/Khazain-Al-Huda-source.zip" HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: Khazain-Al-Huda-source
          path: Khazain-Al-Huda-source.zip
          if-no-files-found: error
          retention-days: 7

  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.8"
          cache: true
          cache-key: flutter-3.32.8

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khazain-Al-Huda-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
