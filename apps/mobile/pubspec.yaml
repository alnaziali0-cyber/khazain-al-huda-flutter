name: khazain_al_huda
description: Khazain Al-Huda - a Shia Islamic knowledge and worship companion.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  just_audio: ^0.9.46
  audio_service: ^0.18.19
  audio_session: ^0.1.25
  path_provider: ^2.1.5
  pdfrx: 1.0.103
  share_plus: ^10.1.4
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.1
  intl: ^0.20.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_svg: ^2.0.10+1
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mosque_background.jpg
    - assets/branding/khazain_logo.jpg
    - assets/data/wallpapers.json
    - assets/images/wallpapers/
    - assets/data/prayer_times/
    - assets/data/shia_occasions_hijri.json
    - assets/data/ahl_al_bayt_biographies.json
    - assets/data/iraq_governorates.json
    - assets/data/visitor_guide/iraq_places.json
    - assets/audio/tasbih_click_soft.wav
    - assets/audio/tasbih_tone_soft.wav
    - assets/data/quran/
    - assets/data/library/
    - assets/data/catalogs/shiavoice_recent_library.json
  fonts:
    - family: NotoNaskhArabicUI
      fonts:
        - asset: assets/fonts/NotoNaskhArabicUI-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabicUI-Bold.ttf
          weight: 700
    - family: AlanSansLight
      fonts:
        - asset: assets/fonts/AlanSans-Light.ttf
          weight: 300
    - family: GeezaArabic
      fonts:
        - asset: assets/fonts/GeezaRegular.otf
          weight: 400
        - asset: assets/fonts/GeezaBold.otf
          weight: 700
    - family: BeINArabic
      fonts:
        - asset: assets/fonts/beIN-ArabicNormal.otf
          weight: 400
        - asset: assets/fonts/beIN-ArabicBlack.otf
          weight: 900
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
